name: Deploy todas las semanas a GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "sem01/**"
      - "sem02/**"
      - "sem03/**"
      - "sem04/**"
      - "sem05/**"
      - "sem06/**"
      - "sem07/**"
      - "sem08/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de sem07
        working-directory: sem07
        run: npm install

      - name: Compilar sem07
        working-directory: sem07
        run: npm run build

      - name: Instalar dependencias de sem08
        working-directory: sem08
        run: npm install

      - name: Compilar sem08
        working-directory: sem08
        run: npm run build

      - name: Preparar sitio completo
        run: |
          mkdir -p _site

          # Las semanas 1 a 6 son sitios estáticos.
          for week in sem01 sem02 sem03 sem04 sem05 sem06; do
            cp -R "$week" _site/
          done

          # Las semanas React se publican desde sus builds de Vite.
          mkdir -p _site/sem07 _site/sem08
          cp -R sem07/dist/. _site/sem07/
          cp -R sem08/dist/. _site/sem08/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto completo de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4